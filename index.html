<style>
  :root{
    --ink:rgba(232,240,255,.92);
    --dim:rgba(196,210,238,.55);
    --line:rgba(255,255,255,.14);
    --chip:rgba(10,14,24,.42);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04050a;overflow:hidden;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- 载入幕布 ---------- */
  #loader{position:fixed;inset:0;background:#04050a;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;color:var(--dim);
    font-size:12px;letter-spacing:.35em;transition:opacity 1s ease .15s}
  #loader.done{opacity:0;pointer-events:none}
  .spin{width:38px;height:38px;border:1px solid rgba(160,200,255,.16);position:relative;animation:spin 2.6s linear infinite}
  .spin::before{content:'';position:absolute;inset:7px;border:1px solid rgba(160,200,255,.65);animation:spin 1.5s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader .tip{letter-spacing:.12em;text-align:center;line-height:2}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:20;color:var(--ink)}
  .brand{position:absolute;top:26px;left:30px}
  .brand .k{font-size:10px;letter-spacing:.42em;color:var(--dim);margin-bottom:8px}
  .brand h1{margin:0;font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;
    font-size:21px;font-weight:500;letter-spacing:.14em;color:var(--ink)}
  .brand p{margin:7px 0 0;font-size:11px;letter-spacing:.22em;color:var(--dim)}
  .chips{position:absolute;top:26px;right:30px;display:flex;gap:10px;pointer-events:auto}
  .chips button{pointer-events:auto;cursor:pointer;color:var(--ink);background:var(--chip);
    border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12px;letter-spacing:.12em;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .25s,border-color .25s}
  .chips button:hover{background:rgba(40,52,80,.55);border-color:rgba(255,255,255,.3)}
  .status{position:absolute;left:30px;bottom:26px;display:flex;align-items:center;gap:10px;
    background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:9px 18px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12px;letter-spacing:.14em}
  .status .dot{width:8px;height:8px;border-radius:50%;background:#ffd98a;box-shadow:0 0 10px 2px currentColor;
    animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .status b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
  .status span#phase{color:var(--dim)}
  .hint{position:absolute;right:30px;bottom:30px;font-size:11px;letter-spacing:.2em;color:var(--dim);opacity:.8}
  @media (max-width:640px){
    .brand{top:18px;left:18px}.brand h1{font-size:17px}
    .chips{top:18px;right:18px}.chips button{padding:6px 12px;font-size:11px}
    .status{left:18px;bottom:18px}.hint{display:none}
  }
</style>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ================================================================
   0. 工具：随机数 / 噪声 / 缓动
================================================================ */
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
const rand=mulberry32(20261123);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453123;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return hash2(xi,yi)*(1-u)*(1-v)+hash2(xi+1,yi)*u*(1-v)+hash2(xi,yi+1)*(1-u)*v+hash2(xi+1,yi+1)*u*v;}
function fbm(x,y,oct){oct=oct||4;let a=.5,f=1,s=0;for(let i=0;i<oct;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s;}

const GLSL_NOISE=`
float gh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float gn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
  return mix(mix(gh(i),gh(i+vec2(1.,0.)),u.x),mix(gh(i+vec2(0.,1.)),gh(i+vec2(1.,1.)),u.x),u.y);}
float gfbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*gn(p);p*=2.03;a*=.5;}return s;}
`;

/* ================================================================
   1. 参数与查询串
================================================================ */
const qs=new URLSearchParams(location.search);
const CYCLE=96;                                   // 一昼夜秒数
let dayTime=CYCLE*(parseFloat(qs.get('t'))||0.16);
let speed=parseFloat(qs.get('speed'))||1, paused=false;

const HALF=4.5, BASE=-2.6, BOTTOM=-4.42, T_EXT=4.48;
const LAKE={x:2.5,z:2.0}, LAKE_SURF=-2.94;

/* ================================================================
   2. 渲染器 / 场景 / 相机
================================================================ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.getElementById('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(22,innerWidth/innerHeight,0.1,2000);
camera.position.set(20.5,22.6,26.2);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,-0.5,0);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.enablePan=false;
controls.minDistance=26; controls.maxDistance=62;
controls.minPolarAngle=THREE.MathUtils.degToRad(44);
controls.maxPolarAngle=THREE.MathUtils.degToRad(80);
controls.autoRotate=false; controls.autoRotateSpeed=0.45;
controls.update(); controls.saveState();

let idle=true, idleTimer=null;
controls.addEventListener('start',()=>{idle=false;clearTimeout(idleTimer);});
controls.addEventListener('end',()=>{clearTimeout(idleTimer);idleTimer=setTimeout(()=>idle=true,6000);});
renderer.domElement.addEventListener('dblclick',()=>controls.reset());

/* ================================================================
   3. 环境贴图（深空摄影棚柔光箱）
================================================================ */
const envScene=new THREE.Scene();
function softPanel(w,h,c,px,py,pz){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({color:new THREE.Color(c[0],c[1],c[2]),side:THREE.DoubleSide}));
  m.position.set(px,py,pz); m.lookAt(0,0,0); envScene.add(m);
}
softPanel(8,8,[9.5,9.0,8.0], 0,9,0);
softPanel(3.2,10,[1.1,2.1,3.8], -10,2,3);
softPanel(4.5,6,[3.6,1.7,0.7], 9,-1,-7);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(envScene,0.07).texture;

/* ================================================================
   4. 灯光
================================================================ */
const sun=new THREE.DirectionalLight(0xfff1dc,3);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-6.5,right:6.5,top:6.5,bottom:-6.5,near:2,far:45});
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.02;
scene.add(sun); scene.add(sun.target);

const moon=new THREE.DirectionalLight(0x8fb4ff,0);
moon.castShadow=true; moon.shadow.mapSize.set(1024,1024);
Object.assign(moon.shadow.camera,{left:-6.5,right:6.5,top:6.5,bottom:-6.5,near:2,far:45});
moon.shadow.camera.updateProjectionMatrix();
moon.shadow.bias=-0.0008; moon.shadow.normalBias=0.02;
scene.add(moon); scene.add(moon.target);

const hemi=new THREE.HemisphereLight(0xa9c9ef,0x6b5c48,0.55); scene.add(hemi);
const amb=new THREE.AmbientLight(0x1a2440,0.12); scene.add(amb);

/* ================================================================
   5. 地形函数（含河道距离场）
================================================================ */
const riverPts=[[-2.30,-1.60],[-1.95,-1.20],[-1.75,-0.95],[-0.85,-0.30],
                [0.15,0.35],[1.20,1.00],[1.85,1.55]];
const riverCurve=new THREE.CatmullRomCurve3(riverPts.map(p=>new THREE.Vector3(p[0],0,p[1])));
const rp=riverCurve.getPoints(200);           // 201 个采样点

// 河道距离场网格（双线性查询，避免逐点暴力）
const DG_N=160, dGrid=new Float32Array(DG_N*DG_N);
for(let i=0;i<DG_N;i++)for(let j=0;j<DG_N;j++){
  const x=-T_EXT+2*T_EXT*i/(DG_N-1), z=-T_EXT+2*T_EXT*j/(DG_N-1);
  let d2=1e9;
  for(let k=0;k<rp.length;k++){const dx=x-rp[k].x,dz=z-rp[k].z;const dd=dx*dx+dz*dz;if(dd<d2)d2=dd;}
  dGrid[i*DG_N+j]=Math.sqrt(d2);
}
function distToPath(x,z){
  const fx=clamp((x+T_EXT)/(2*T_EXT),0,1)*(DG_N-1), fz=clamp((z+T_EXT)/(2*T_EXT),0,1)*(DG_N-1);
  const i=Math.floor(fx),j=Math.floor(fz),i2=Math.min(i+1,DG_N-1),j2=Math.min(j+1,DG_N-1);
  const u=fx-i,v=fz-j;
  return lerp(lerp(dGrid[i*DG_N+j],dGrid[i2*DG_N+j],u),lerp(dGrid[i*DG_N+j2],dGrid[i2*DG_N+j2],u),v);
}
function terrainH(x,z){
  let h=(fbm(x*0.5+9.2,z*0.5+3.1)-0.5)*0.42;                       // 草地起伏
  const dm=(x+2.55)**2+(z+2.35)**2;                                // 主雪山
  h+=3.05*Math.exp(-dm/(2*1.35*1.35));
  const ds=(x+2.0)**2+(z+1.1)**2;                                  // 肩部山脊
  h+=1.02*Math.exp(-ds/(2*1.9*1.9));
  h+=1.15*smoothstep(1.02,1.30,-0.736*x-0.677*z);                  // 高地台地+断崖带
  const dl=(x-LAKE.x)**2+(z-LAKE.z)**2;                            // 湖盆
  h+=-0.85*Math.exp(-dl/(2*1.05*1.05));
  h-=0.36*smoothstep(0.75,0.12,distToPath(x,z));                   // 河道下切
  return h;
}
function slopeAt(x,z){const e=0.09;
  return Math.hypot(terrainH(x+e,z)-terrainH(x-e,z),terrainH(x,z+e)-terrainH(x,z-e))/(2*e);}
function groundY(x,z){return BASE+terrainH(x,z);}
function forestMask(x,z){
  return smoothstep(0.46,0.60,fbm(x*0.34+13.7,z*0.34+5.2))
        *smoothstep(0.30,1.20,terrainH(x,z));
}

/* ================================================================
   6. 世界组（整个玻璃立方一起悬浮呼吸）
================================================================ */
const world=new THREE.Group(); scene.add(world);

/* ---------- 6.1 地形网格 ---------- */
const C_GRASS_A=new THREE.Color(0x8fb968), C_GRASS_B=new THREE.Color(0x639a4f),
      C_FOREST_F=new THREE.Color(0x557d4a), C_SAND=new THREE.Color(0xd9c9a3),
      C_ROCK_A=new THREE.Color(0x9a928a), C_ROCK_B=new THREE.Color(0x7e7973),
      C_SNOW=new THREE.Color(0xf2f6fa), C_BED=new THREE.Color(0x4e6058),
      C_RIVERBED=new THREE.Color(0xb9a985);

function terrainColor(x,z,h,slope,out){
  const n=fbm(x*2.3+4.4,z*2.3+7.7);
  out.copy(C_GRASS_A).lerp(C_GRASS_B,n);
  out.lerp(C_FOREST_F,forestMask(x,z)*0.75);
  const dl=Math.hypot(x-LAKE.x,z-LAKE.z);
  const sand=smoothstep(0.18,0.02,Math.abs(h+0.35))*smoothstep(2.1,1.3,dl)
            +smoothstep(0.30,0.06,distToPath(x,z))*smoothstep(1.2,0.3,h);
  out.lerp(C_SAND,clamp(sand,0,1)*0.85);
  const bed=smoothstep(-0.30,-0.55,h); out.lerp(C_BED,bed);
  const rockW=clamp(smoothstep(0.55,0.95,slope)+smoothstep(1.7,2.6,h),0,1);
  const rock=C_ROCK_A.clone().lerp(C_ROCK_B,n);
  out.lerp(rock,rockW*0.9);
  const snowW=smoothstep(2.15,2.50,h+n*0.25-slope*0.6);
  out.lerp(C_SNOW,snowW);
}
{
  const seg=132;
  const geo=new THREE.PlaneGeometry(2*T_EXT,2*T_EXT,seg,seg);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position, n=pos.count;
  const colors=new Float32Array(n*3), tmp=new THREE.Color();
  for(let i=0;i<n;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const h=terrainH(x,z);
    pos.setY(i,BASE+h);
    terrainColor(x,z,h,slopeAt(x,z),tmp);
    colors[i*3]=tmp.r;colors[i*3+1]=tmp.g;colors[i*3+2]=tmp.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  geo.computeVertexNormals();
  const terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({
    vertexColors:true,flatShading:true,roughness:0.95,metalness:0,envMapIntensity:0.25}));
  terrain.receiveShadow=true; terrain.castShadow=true;
  world.add(terrain);
}

/* ---------- 6.2 剖面土层墙（玻璃内侧的切面地层） ---------- */
{
  const stops=[[0.00,new THREE.Color(0x4a3a2e)],[0.22,new THREE.Color(0x66523f)],
               [0.45,new THREE.Color(0x57483c)],[0.70,new THREE.Color(0x3f352c)],
               [1.00,new THREE.Color(0x231d17)]];
  function strata(d,out){
    for(let i=0;i<stops.length-1;i++){
      if(d<=stops[i+1][0]){
        const t=(d-stops[i][0])/(stops[i+1][0]-stops[i][0]);
        return out.copy(stops[i][1]).lerp(stops[i+1][1],t);
      }
    }
    return out.copy(stops[stops.length-1][1]);
  }
  function wall(axis,sign){
    const cols=132,rows=6,pos=[],col=[],idx=[],tmp=new THREE.Color();
    for(let c=0;c<=cols;c++){
      const t=c/cols,o=-T_EXT+2*T_EXT*t;
      let x,z;
      if(axis==='x'){x=T_EXT*sign;z=o;}else{x=o;z=T_EXT*sign;}
      const top=BASE+terrainH(x,z);
      const j=(fbm(o*3.1+axis.charCodeAt(0),sign*7.7)-0.5)*0.22;
      for(let r=0;r<=rows;r++){
        const v=r/rows,y=top*(1-v)+BOTTOM*v;
        pos.push(x,y,z);
        strata(clamp(1-v+j,0,1),tmp);
        col.push(tmp.r,tmp.g,tmp.b);
      }
    }
    for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){
      const a=c*(rows+1)+r,b=a+1,d2=a+rows+1,e=d2+1;
      idx.push(a,b,d2,b,e,d2);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    g.setIndex(idx); g.computeVertexNormals();
    const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({
      vertexColors:true,roughness:0.92,metalness:0,side:THREE.DoubleSide,envMapIntensity:0.2}));
    m.receiveShadow=true; world.add(m);
  }
  wall('x',1);wall('x',-1);wall('z',1);wall('z',-1);
  const bottom=new THREE.Mesh(new THREE.PlaneGeometry(2*T_EXT,2*T_EXT),
    new THREE.MeshStandardMaterial({color:0x1b1511,roughness:1}));
  bottom.rotation.x=Math.PI/2; bottom.position.y=BOTTOM; world.add(bottom);
}

/* ================================================================
   7. 水体（河道 / 湖泊 / 瀑布）
================================================================ */
const WATER_VERT=`
attribute float aSlope;
varying vec2 vUv; varying float vSlope;
void main(){vUv=uv;vSlope=aSlope;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const WATER_FRAG=GLSL_NOISE+`
uniform float uTime,uMode,uOpacity,uSpark,uDim;
uniform vec3 uShallow,uDeep,uFoam;
varying vec2 vUv; varying float vSlope;
void main(){
  vec3 col; float alpha=uOpacity;
  if(uMode<0.5){                                  /* 河流 */
    float flowN=gn(vec2(vUv.x*7.0,vUv.y*26.0-uTime*1.35));
    float band=0.5+0.5*sin(vUv.y*90.0-uTime*3.2+flowN*4.0);
    float edgeF=1.0-smoothstep(0.0,0.18,vUv.x)*smoothstep(1.0,0.82,vUv.x);
    float slopeF=smoothstep(0.35,1.05,vSlope)*0.45;
    float foam=clamp(edgeF*0.5+slopeF+smoothstep(0.62,0.95,band)*slopeF*0.7,0.0,1.0);
    col=mix(uDeep,uShallow,clamp(edgeF*0.35+flowN*0.25,0.0,1.0));
    col=mix(col,uFoam,foam*0.85);
    float sp=pow(gn(vec2(vUv.x*40.0,vUv.y*60.0-uTime*2.0)),6.0)*2.4;
    col+=vec3(1.0,0.98,0.9)*sp*uSpark;
  }else{                                          /* 湖泊 */
    vec2 c=vUv-0.5; float r=length(c)*2.0;
    float ripple=0.5+0.5*sin(r*34.0-uTime*1.7+gn(vUv*9.0+uTime*0.15)*5.0);
    float shore=smoothstep(0.55,0.92,r);
    col=mix(uDeep,uShallow,shore*0.55+ripple*0.10);
    float foam=shore*smoothstep(0.75,0.95,ripple)*0.6;
    col=mix(col,uFoam,foam);
    float sp=pow(gn(vUv*46.0+vec2(0.0,uTime*0.8)),7.0)*2.6;
    col+=vec3(1.0,0.97,0.88)*sp*uSpark;

  tries=tries||1600; const out=[];
  for(let i=0;i<tries&&out.length<count;i++){

}

    const v=new THREE.Vector3(rand()*2-1,rand()*2-1,rand()*2-1).normalize()
      .multiplyScalar(10+rand()*34);
    pos.push(v.x,v.y,v.z);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({map:softDot,size:0.14,transparent:true,opacity:0.5,
    blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true,color:0x8fa8d0});
  scene.add(new THREE.Points(g,m));
}

/* ================================================================
   13. 后期：Bloom + 移轴/暗角/颗粒
================================================================ */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.45,0.85,0.75);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const tiltPass=new ShaderPass({
  uniforms:{tDiffuse:{value:null},uRes:{value:new THREE.Vector2(1,1)},uTime:{value:0},uBlur:{value:1.0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform vec2 uRes;uniform float uTime,uBlur;
    varying vec2 vUv;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      vec2 uv=vUv,px=1.0/uRes;
      vec2 c=uv-0.5;c.x*=uRes.x/uRes.y;
      float d=length(c);
      float radial=smoothstep(0.42,0.74,d);
      float band=smoothstep(0.86,1.0,uv.y)+smoothstep(0.14,0.0,uv.y);
      float m=clamp(max(radial,band)*uBlur,0.0,1.0);
      float r=(1.2+9.0*m);
      vec3 col=vec3(0.0);
      for(int i=0;i<12;i++){
        float fi=float(i);
        float a=fi*2.399963;
        float rr=sqrt((fi+0.5)/12.0);
        vec2 o=vec2(cos(a),sin(a))*rr;
        col+=texture2D(tDiffuse,uv+o*px*r).rgb;
      }
      col/=12.0;
      vec3 sharp=texture2D(tDiffuse,uv).rgb;
      col=mix(sharp,col,clamp(m*1.2,0.0,1.0));
      float ca=(0.4+2.0*m)*px.x;
      vec2 dir=normalize(c+vec2(1e-5));
      col.r=texture2D(tDiffuse,uv+dir*ca).r;
      col.b=texture2D(tDiffuse,uv-dir*ca).b;
      float vig=smoothstep(1.08,0.32,d);
      col*=mix(0.58,1.0,vig);
      col+= (hash(uv*uRes*0.6+fract(uTime*13.7)*7.0)-0.5)*0.026;
      gl_FragColor=vec4(col,1.0);
    }`});
tiltPass.renderToScreen=true;
composer.addPass(tiltPass);

/* ================================================================
   14. HUD 交互
================================================================ */
const btnPause=document.getElementById('btnPause');
const btnSpeed=document.getElementById('btnSpeed');
btnSpeed.textContent='速度 ×'+speed;
btnPause.addEventListener('click',()=>{
  paused=!paused;
  btnPause.textContent=paused?'▶ 继续昼夜':'⏸ 暂停昼夜';
});
const speeds=[1,2,4];
btnSpeed.addEventListener('click',()=>{
  speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];
  btnSpeed.textContent='速度 ×'+speed;
});
const clockEl=document.getElementById('clock'),phaseEl=document.getElementById('phase'),
      dotEl=document.getElementById('phaseDot');

/* ================================================================
   15. 昼夜系统 + 主循环
================================================================ */
const C={
  sunDay:new THREE.Color(0xfff1dc),sunDusk:new THREE.Color(0xff8e5a),
  hemiSkyD:new THREE.Color(0xa9c9ef),hemiSkyN:new THREE.Color(0x16203c),
  hemiGndD:new THREE.Color(0x6b5c48),hemiGndN:new THREE.Color(0x0a0d16),
  rimD:new THREE.Color(0xffffff),rimN:new THREE.Color(0x8fd8ff),
  grDay:new THREE.Color(0xfff3d8),grDusk:new THREE.Color(0xff9e5e),
  mistD:new THREE.Color(0xd8e8ee),mistN:new THREE.Color(0x1c2a44),
  edgeD:new THREE.Color(0xffffff),edgeN:new THREE.Color(0x8fd8ff),
  tmpA:new THREE.Color(),tmpB:new THREE.Color()
};
const env={day:1,dusk:0,night:0,e:1};
const sunDir=new THREE.Vector3(),moonDir=new THREE.Vector3();

function updateDayNight(t){
  const a=(dayTime/CYCLE)*Math.PI*2;
  const e=Math.sin(a);
  const day=smoothstep(0.18,0.42,e);
  const dusk=(1-day)*smoothstep(-0.05,0.18,e);
  const night=smoothstep(-0.04,-0.30,e);
  env.day=day;env.dusk=dusk;env.night=night;env.e=e;

  sunDir.set(Math.cos(a),Math.sin(a)*0.92,Math.sin(a)*0.35+0.30).normalize();
  moonDir.set(-Math.cos(a),Math.max(0.08,-Math.sin(a)*0.9),-Math.sin(a)*0.35-0.22).normalize();
  sun.position.copy(sunDir).multiplyScalar(20);
  sun.intensity=3.2*day+1.7*dusk;
  C.tmpA.copy(C.sunDusk).lerp(C.sunDay,day); sun.color.copy(C.tmpA);
  moon.position.copy(moonDir).multiplyScalar(20);
  moon.intensity=0.32*night;
  hemi.intensity=0.55*day+0.3*dusk+0.10*night+0.06;
  hemi.color.copy(C.tmpB.copy(C.hemiSkyN).lerp(C.hemiSkyD,day+dusk*0.5));
  hemi.groundColor.copy(C.tmpB.copy(C.hemiGndN).lerp(C.hemiGndD,day));
  amb.intensity=0.10+0.08*night;
  window.__innerLight.intensity=0.35+0.3*dusk+0.08*night;

  sunSprite.position.copy(sunDir).multiplyScalar(430);
  sunSprite.material.opacity=Math.max(0,Math.min(1,(e+0.08)*3))*(0.85-dusk*0.2);
  sunSprite.material.color.copy(C.tmpB.copy(C.sunDusk).lerp(new THREE.Color(0xfff0d0),day));
  moonSprite.position.copy(moonDir).multiplyScalar(430);
  moonSprite.material.opacity=night*0.9;

  skyU.uNeb.value=0.55+0.85*night;
  starU.uOp.value=0.15+0.8*night+0.1*dusk;

  rimU.uInt.value=0.35*day+1.5*night+0.5*dusk;
  rimU.uColor.value.copy(C.tmpB.copy(C.rimD).lerp(C.rimN,night+dusk*0.35));
  edgeLines.material.opacity=0.18+0.45*night;
  edgeLines.material.color.copy(C.tmpB.copy(C.edgeD).lerp(C.edgeN,night));
  window.__cornerDotMat.opacity=0.05+0.75*night+0.25*dusk;
  window.__halo.material.opacity=0.14+0.18*night;

  godrayMat.uniforms.uIntensity.value=0.04+0.09*day+0.09*dusk;
  godrayMat.uniforms.uColor.value.copy(C.tmpB.copy(C.grDay).lerp(C.grDusk,dusk));
  if(e>-0.05){
    // 限制光锥倾角，保持大体向下，避免伸出立方体外
    godray.quaternion.setFromUnitVectors(godrayDown,
      new THREE.Vector3(-sunDir.x*0.35,-1.0,-sunDir.z*0.35).normalize());
  }
  godray.visible=e>-0.05;

  bloom.strength=0.45+0.22*night;
  bloom.threshold=0.75-0.10*night;
  renderer.toneMappingExposure=1.12+0.06*dusk-0.10*night;

  // 水体昼夜明暗
  const wDim=1-0.5*night;
  waterUniforms.uDim.value=wDim;
  lakeMat.uniforms.uDim.value=wDim;
  fallMats.forEach(m=>{ m.uniforms.uOpacity.value=(m.userData.base||0.8)*(1-0.45*night); });
  window.__cloudMat.color.setScalar(1-0.55*night);

  fireflyU.uOp.value=night*0.95+0.12*dusk;
  dustU.uBeam.value=0.3+0.8*day+0.3*dusk;
  const dawnBell=Math.exp(-((e-0.10)*(e-0.10))/(0.12*0.12));
  window.__mistBoost=(1+1.7*dawnBell*(1-night*0.5));
  C.tmpB.copy(C.mistN).lerp(C.mistD,day+dusk*0.6);
  mistPlanes.forEach(mp=>{
    mp.m.material.color.copy(C.tmpB);
    mp.m.material.opacity=mp.base*window.__mistBoost;
  });
  window.__mushGlow=night;
  window.__birdFade=1-night;
  fallMist.forEach(f=>{f.sp.material.opacity=0.30*window.__mistBoost;});
}
window.__innerLight=new THREE.PointLight(0xffe2b8,0.4,14,1.8);
window.__innerLight.position.set(0,3.2,0);
world.add(window.__innerLight);

// 蝴蝶/鸟可见性由 updateDayNight 中 __birdFade 控制
function updateCreatures(t,dt){
  const e=env.e, calm=1-env.night*0.45;

  // 鹿：沿草甸椭圆漫步
  const u1=(t*0.016*calm)%1, u2=(t*0.021*calm+0.5)%1;
  placeWalker(deer,deerPath,u1,0.30,0);
  placeWalker(fawn,deerPath,u2,0.30,0.14);

  function placeWalker(w,path,u,legAmp,ph){
    const p=path.getPointAt(u),tan=path.getTangentAt(u);
    const gy=groundY(p.x,p.z);
    w.g.position.set(p.x,gy,p.z);
    w.g.rotation.y=Math.atan2(tan.x,tan.z);
    const s=t*7*calm;
    w.legs.forEach((leg,i)=>{leg.rotation.x=Math.sin(s+(i%2)*Math.PI+(i>1?0.6:0))*legAmp;});
    w.g.position.y+=Math.abs(Math.sin(s))*0.012;
    w.neck.rotation.z=Math.sin(s*0.5+ph)*0.06;
    w.head.rotation.x=Math.sin(s*0.5+ph+1)*0.05;
  }

  // 兔子：跳跃+停顿
  rabbits.forEach((r,i)=>{
    const cyc=(t*0.6+i*1.7)%3;
    const base=rabbitPath;
    if(cyc<0.35){
      const u=baseU(i,cyc/0.35);
      const p=base.getPointAt(u),tan=base.getTangentAt(u);
      r.position.set(p.x,groundY(p.x,p.z)+Math.sin((cyc/0.35)*Math.PI)*0.10,p.z);
      r.rotation.y=Math.atan2(tan.x,tan.z);
      r.rotation.x=-0.25*Math.sin((cyc/0.35)*Math.PI);
    }else{
      const u=baseU(i,1);
      const p=base.getPointAt(u);
      r.position.set(p.x,groundY(p.x,p.z),p.z);
      r.rotation.x=0;
      r.rotation.y+=Math.sin(t*0.4+i)*0.002;
    }
  });
  function baseU(i,seg){
    const idx=Math.min(3,Math.floor((t*0.6+i*1.7)/3)%4);
    return clamp((idx+seg)/4,0,1)*(i===0?0.85:0.95)+ (i===0?0:0.02);
  }

  // 鸭子：湖面绕圈
  ducks.forEach((d,i)=>{
    const a=t*(0.10+i*0.03)*(i===2?0.6:1)+i*2.1;
    const r=0.55+i*0.22;
    const x=LAKE.x+Math.cos(a)*r,z=LAKE.z+Math.sin(a)*r;
    d.position.set(x,LAKE_SURF+0.01+Math.sin(t*2+i)*0.008,z);
    d.rotation.y=Math.atan2(-Math.sin(a),Math.cos(a));
    d.rotation.z=Math.sin(t*1.4+i)*0.05;
  });

  // 锦鲤
  fish.forEach((f,i)=>{
    const a=t*(0.25+i*0.08)+i*2.3;
    f.position.x=LAKE.x+Math.cos(a)*(0.5+i*0.14);
    f.position.z=LAKE.z+Math.sin(a)*(0.42+i*0.12);
    f.position.y=-3.08+Math.sin(t*1.2+i)*0.02;
    f.rotation.y=Math.atan2(-Math.sin(a),Math.cos(a));
  });

  // 鸟
  birds.forEach(b=>{
    const a=t*b.sp+b.ph;
    const x=0.7+Math.cos(a)*b.r,z=0.5+Math.sin(a)*b.r*0.8;
    b.g.position.set(x,b.y+Math.sin(a*2.3)*0.15,z);
    b.g.rotation.y=Math.atan2(-Math.sin(a),Math.cos(a));
    b.g.rotation.z=Math.sin(a)*0.25;
    const flap=Math.sin(t*11+b.ph)*0.55;
    b.wL.rotation.z=0.25+flap; b.wR.rotation.z=-0.25-flap;
    b.mat.opacity=window.__birdFade;
    b.g.visible=window.__birdFade>0.03;
  });

  // 蝴蝶
  butterflies.forEach(b=>{
    const x=b.cx+Math.sin(t*b.f1+b.p1)*0.55;
    const z=b.cz+Math.cos(t*b.f2+b.p2)*0.5;
    const gy=groundY(clamp(x,-4,4),clamp(z,-4,4));
    b.g.position.set(x,gy+b.h+Math.sin(t*b.f1*1.7+b.p3)*0.12,z);
    b.g.rotation.y=Math.sin(t*0.7+b.p2)*2.4;
    const flap=Math.sin(t*16+b.p1)*0.85+0.25;
    b.wL.rotation.z=flap; b.wR.rotation.z=-flap;
    b.mat.opacity=(1-env.night);
    b.g.visible=(1-env.night)>0.03;
  });

  // 云
  clouds.forEach(c=>{
    c.g.position.x+=c.sp*dt;
    if(c.g.position.x>2.9)c.g.position.x=-2.9;
    if(c.g.position.x<-2.9)c.g.position.x=2.9;
    c.g.position.y+=Math.sin(t*0.4+c.ph)*0.0006;
  });

  // 薄雾
  mistPlanes.forEach(mp=>{
    mp.m.rotation.z+=mp.sp*dt*0.4;
    mp.m.position.x+=Math.sin(t*0.2+mp.ph)*0.0008;
  });

  // 瀑布水雾
  fallMist.forEach(f=>{
    const s=0.6+0.4*Math.sin(t*1.5+f.ph);
    f.sp.scale.setScalar(f.sp0*s);
    f.sp.position.y=f.sp.position.y+Math.sin(t*2+f.ph)*0.0008;
  });

  // 蘑菇夜光
  mushCaps.forEach(mc=>{
    mc.capM.emissiveIntensity=0.05+window.__mushGlow*1.5;
    mc.glow.material.opacity=window.__mushGlow*0.5;
  });

  // 浮空碎岛
  shards.forEach(s=>{
    const a=s.ph*0.3+t*0.03;
    s.g.position.set(Math.cos(a)*s.r,s.y+Math.sin(t*0.5+s.ph)*0.3,Math.sin(a)*s.r);
    s.g.rotation.y=t*0.05+s.ph;
  });
}
// 粒子时间
function updateParticles(t){
  fireflyU.uTime.value=t; dustU.uTime.value=t; snowU.uTime.value=t;
  godrayMat.uniforms.uTime.value=t;
  skyU.uTime.value=t; starU.uTime.value=t;
  waterUniforms.uTime.value=t; lakeMat.uniforms.uTime.value=t;
  fallUniforms.uTime.value=t;
  if(fallMats.length){fallMats.forEach(m=>m.uniforms.uTime.value=t);}
  tiltPass.uniforms.uTime.value=t;
}

/* ---------- HUD 时钟 ---------- */
let hudT=0;
function updateHUD(dt){
  hudT+=dt; if(hudT<0.25)return; hudT=0;
  const hour=(dayTime/CYCLE*24+7.5)%24;
  const hh=String(Math.floor(hour)).padStart(2,'0');
  const mm=String(Math.floor((hour%1)*60)).padStart(2,'0');
  clockEl.textContent=hh+':'+mm;
  const rising=Math.cos((dayTime/CYCLE)*Math.PI*2)>0;
  let label,col;
  if(env.e>0.42){label='白昼';col='#ffe9b8';}
  else if(env.e>-0.04&&rising){label='晨光';col='#ffc98a';}
  else if(env.e>-0.04){label='暮色';col='#ff9e6e';}
  else{label='夜晚';col='#7fa8ff';}
  phaseEl.textContent=label;
  dotEl.style.color=col; dotEl.style.background=col;
}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let __useTimer=false,__lastFrame=performance.now(),__gen=0;
function animate(){
  const myGen=++__gen;
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  if(!paused)dayTime=(dayTime+dt*speed)%CYCLE;

  updateDayNight(t);
  updateCreatures(t,dt);
  updateParticles(t);

  // 立方体悬浮呼吸
  world.position.y=Math.sin(t*0.35)*0.14;
  world.rotation.z=Math.sin(t*0.23)*0.008;
  world.rotation.x=Math.cos(t*0.19)*0.008;

  controls.autoRotate=idle;
  controls.update();
  updateHUD(dt);
  composer.render();
  window.__ok=true;
  __lastFrame=performance.now();
  // rAF 看门狗：某些环境（后台标签/嵌入面板）会暂停 rAF，自动降级为定时器驱动
  const next=()=>{ if(__gen===myGen) animate(); };
  if(__useTimer||document.hidden){
    setTimeout(next,33);
  }else{
    requestAnimationFrame(next);
    setTimeout(()=>{
      if(performance.now()-__lastFrame>1100){
        __useTimer=true;
        if(__gen===myGen) animate();   // 踢一脚，切换到定时器链
      }
    },1200);
  }
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  tiltPass.uniforms.uRes.value.set(innerWidth,innerHeight);
});
tiltPass.uniforms.uRes.value.set(innerWidth,innerHeight);
window.__glass=glass;

// 载入幕布淡出
setTimeout(()=>{
  document.getElementById('loader').classList.add('done');
},900);

animate();
</script>
